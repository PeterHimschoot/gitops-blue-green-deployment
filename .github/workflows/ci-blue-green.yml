name: CI

on: 
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/SimpleWebApp/SimpleWebApp.csproj --configuration Release --output publish
      - name: Zip artifact
        run: cd publish && zip -r ../ExampleAppBuild.zip . && cd ..
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ExampleAppBuild
          path: ExampleAppBuild.zip

